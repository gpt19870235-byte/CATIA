{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-header">新增刀具</div>
  <div class="card-body">
    <form method="post" action="/tools" class="row g-3">
      <div class="col-md-4"><label class="form-label">刀具編號</label><input name="code" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">名稱</label><input name="name" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">型號</label><input name="model" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">供應商</label><input name="vendor" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">適用機台</label><input name="applicable_machine" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">壽命分鐘上限</label><input name="life_minutes_limit" type="number" min="1" class="form-control" required /></div>
      <div class="col-md-4"><label class="form-label">安全庫存</label><input name="safety_stock" type="number" min="0" class="form-control" required /></div>
      <div class="col-12"><button class="btn btn-primary">建立</button></div>
    </form>
  </div>
</div>
{% endblock %}
