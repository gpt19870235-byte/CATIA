version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tool_management
      POSTGRES_USER: tool_admin
      POSTGRES_PASSWORD: tool_admin_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tool_admin:tool_admin_pw@db:5432/tool_management
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
